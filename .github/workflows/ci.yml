name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ph0-t01-skeleton
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types and tests
        env:
          GHARPLAN_ASSET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check
      - name: Build web application
        run: pnpm build
      - name: Install pinned Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser recovery and onboarding tests
        run: pnpm e2e
      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  database:
    name: Cloud database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the runner's PostgreSQL 16
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
          psql --version
      - name: Migration, RLS, save protocol and concurrency tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash server/supabase/tests/run.sh

  android:
    name: Android debug
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare local web assets
        # D71: optional public cloud values for the owner's test APK. Unset values keep the app fully local; the build
        # refuses a secret or service-role key (vite.config.ts).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
        run: pnpm android:sync
      - name: Prepare Android SDK components
        run: |
          task_sdk_bin="$(node scripts/android-sdk-bin.mjs "$ANDROID_HOME")"
          printf 'GHARPLAN_ANDROID_SDK_BIN=%s\n' "$task_sdk_bin" >> "$GITHUB_ENV"
          "$task_sdk_bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Build and lint debug APK
        working-directory: apps/web/android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Record APK and dependency evidence
        working-directory: apps/web/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:dependencies --configuration debugRuntimeClasspath > app/build/outputs/native-dependencies.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          "$GHARPLAN_ANDROID_SDK_BIN/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/manifest.xml
          "$GHARPLAN_ANDROID_SDK_BIN/apkanalyzer" dex code --class com.gharplan.app.MainActivity app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/registration.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          python ../../../scripts/verify-android-apk.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/manifest.xml app/build/outputs/apk/debug/registration.txt > app/build/outputs/apk/debug/verification.json
      - name: Retain debug APK and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gharplan-debug-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/web/android/app/build/outputs/apk/debug/
            apps/web/android/app/build/reports/lint-results-debug.*
            apps/web/android/app/build/outputs/native-dependencies.txt
            apps/web/android/app/build/test-results/testDebugUnitTest/
            apps/web/dist/
